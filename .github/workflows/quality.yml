name: Quality

on:
  pull_request:
  push:
    branches:
      - main
      - develop

jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mahaexam?schema=public"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/mahaexam?schema=public"
      AUTH_SECRET: "ci-dummy-auth-secret-for-build-and-validation-only-32chars"
      NEXTAUTH_SECRET: "ci-dummy-auth-secret-for-build-and-validation-only-32chars"
      AUTH_COOKIE_NAME: "mahaexam_session"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Prisma validate
        run: npm run prisma:validate

      - name: Prettier check
        run: npm run format:check
        continue-on-error: true

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

      - name: Build
        run: npm run build
